apply plugin: 'com.android.application'

def appName = "nGageSmt"

android {
    signingConfigs {
        release {
            storeFile file('release.keystore.jks')
            storePassword 'atpl123'
            keyAlias 'release'
            keyPassword 'atpl123'
        }
    }
    compileSdk 36
    defaultConfig {
        applicationId "com.atpl.digismt"
        minSdk 21
        //noinspection OldTargetApi,EditedTargetSdkVersion
        targetSdk 35
        versionCode 2
        versionName "1.0.1"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        signingConfig signingConfigs.release
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    namespace 'com.atpl.digismt'

    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            variant.outputs.all { output ->
                def versionName = variant.versionName
                def buildType = variant.buildType.name

                if (output.outputFileName?.endsWith(".aab")) {
                    output.outputFileName = "${appName}-${buildType}-v${versionName}.aab"
                } else {
                    outputFileName = "${appName}-${buildType}-v${versionName}.apk"
                }
            }
        }
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.itextpdf:itextg:5.5.10'
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
